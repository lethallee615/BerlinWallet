# cargo-deny configuration for Berlin Wallet.
#
# Licenses: the requested permissive set plus the licenses already present in
# the dependency graph (MPL-2.0 for uniffi/webpki, CC0-1.0 for the bitcoin
# crates, Unicode-3.0 for ICU, and a few compatible one-offs).

[advisories]
version = 2
# cargo-deny v2 hard-fails vulnerability advisories and has no "warn" mode for
# them. CI runs this check with continue-on-error so advisories stay visible
# as warnings without blocking the build; yanked crates warn here as well.
ignore = [
  { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5/0.13.0 via the Fedimint-pinned iroh/pkarr; the IterMut soundness path is not used and the fixed 0.16.3 is semver-incompatible with those requirements" },
  { id = "RUSTSEC-2026-0190", reason = "anyhow 1.0.98 is pinned; wallet code never calls downcast_mut after adding context" },
  { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2 via iroh; the wallet does not enable DNSSEC validation" },
  { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25.2 via iroh; resolver input is limited to configured federation endpoints" },
  { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks 0.1.3 via fedimint-core; the affected Drop-panic path is not reachable from wallet data" },
  { id = "RUSTSEC-2026-0346", reason = "rustls 0.21.12 via minreq; the wallet does not use a custom ClientSessionStore or log sessions" },
  { id = "RUSTSEC-2026-0349", reason = "rustls 0.21.12 via minreq; no post-quantum guarantee is claimed for Esplora HTTP" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7/0.102.8; the wallet does not use URI name constraints" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101.7/0.102.8; wildcard name constraints are not used" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7/0.102.8; the wallet does not parse CRLs" },
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 via iroh; the wallet does not use CRLs" },
]
yanked = "warn"
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MITNFA",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
# Several crates in the graph are dual/tri-licensed; this keeps the allow list
# stable when one arm of an OR expression is checked independently.
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "tag"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# [patch.crates-io] points the fedimint crates at tag v0.12.0.
allow-git = ["https://github.com/fedimint/fedimint"]
