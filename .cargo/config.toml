# Build configuration for Berlin Wallet.
#
# `bdk_wallet` 3.2.0 gates its `bdk-tx` (PSBT/fee) API behind
# `--cfg bdk_wallet_unstable` in addition to the `bdk-tx` feature; its
# src/lib.rs emits a `compile_error!` otherwise.
#
# The bindgen environment (LIBCLANG_PATH, BINDGEN_EXTRA_CLANG_ARGS) is not set
# here. It comes from the shell and must be re-derived per machine; see
# docs/API-VERIFICATION.md §40.

[build]
rustflags = ["--cfg", "bdk_wallet_unstable"]
