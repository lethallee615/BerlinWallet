[package]
name = "berlin-wallet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "berlin_wallet_core"

[dependencies]
anyhow = "=1.0.98"
async-trait = "=0.1.88"
fedimint-client = "=0.12.0"
fs-lock = "=0.1.10"
fedimint-client-module = "=0.12.0"
fedimint-connectors = "=0.12.0"
fedimint-core = "=0.12.0"
fedimint-derive-secret = "=0.12.0"
fedimint-eventlog = "=0.12.0"
fedimint-lnv2-client = "=0.12.0"
fedimint-lnv2-common = "=0.12.0"
fedimint-mintv2-client = "=0.12.0"
fedimint-mintv2-common = "=0.12.0"
fedimint-rocksdb = "=0.12.0"
fedimint-walletv2-client = "=0.12.0"
fedimint-walletv2-common = "=0.12.0"
bdk_wallet = { version = "=3.2.0", features = ["bdk-tx", "file_store", "rusqlite"] }
bdk_chain = "=0.23.3"
bdk_file_store = "=0.22.0"
bdk_esplora = "=0.22.1"
bdk_electrum = "=0.23.2"
bdk_bitcoind_rpc = "=0.22.0"
bip39 = { version = "=2.2.0", features = ["rand"] }
lightning-invoice = { version = "0.33.2", features = ["std"] }
bitcoin = { version = "=0.32.8", features = ["serde"] }
futures = "0.3"
rand = "0.8"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.18"
tokio = { version = "1", features = ["full"] }
tracing = "=0.1.44"
uniffi = "=0.32.0"
uuid = { version = "1", features = ["v7", "serde"] }
