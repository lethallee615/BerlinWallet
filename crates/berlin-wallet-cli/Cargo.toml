[package]
name = "berlin-wallet-cli"
version = "0.1.0"
edition = "2024"
description = "Manual-run harness for Berlin Wallet core."

[[bin]]
name = "berlin-wallet"
path = "src/main.rs"

[dependencies]
berlin-wallet-core = { path = "../berlin-wallet-core" }
anyhow = "=1.0.98"
bitcoin = "=0.32.8"
fedimint-client = "=0.12.0"
fedimint-connectors = "=0.12.0"
fedimint-core = "=0.12.0"
fedimint-walletv2-client = "=0.12.0"
tokio = { version = "1", features = ["full"] }
